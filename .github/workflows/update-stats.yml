name: Update GitHub profile statistics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Generate statistics SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_USERNAME: AmuuLakh
        run: python scripts/generate_stats.py
      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/activity.svg
          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
          else
            git commit -m "chore: refresh GitHub profile statistics"
            git push
          fi
